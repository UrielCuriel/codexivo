name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar versión del tag
        shell: bash
        run: |
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("El tag debe coincidir con package.json");'
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
      - run: bun run build
      - run: bun run test:package
      - run: bun run build:binary
      - name: Probar ejecutable nativo
        shell: bash
        run: |
          printf 'imprimir("Hola desde el binario");' > prueba.cdx
          binary=$(find dist/binaries -type f ! -name '*.map' | head -n 1)
          result=$("$binary" prueba.cdx)
          test "$result" = 'Hola desde el binario'

  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - bun-linux-x64
          - bun-linux-arm64
          - bun-linux-x64-musl
          - bun-linux-arm64-musl
          - bun-darwin-x64
          - bun-darwin-arm64
          - bun-windows-x64
          - bun-windows-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build:binary ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/binaries/*
          if-no-files-found: error

  publish:
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publicar npm mediante OIDC
        shell: bash
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          npm publish --access public --provenance --tag "$tag"
      - uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true
      - name: Crear release y adjuntar ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release-binaries
          sha256sum codexivo-* > SHA256SUMS.txt
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" codexivo-* SHA256SUMS.txt --clobber
